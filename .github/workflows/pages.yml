name: Website

# Builds the GitHub Pages site (website/build_site.py) and deploys it.  The media
# are not in git: the build downloads one archive of posters, small preview clips
# and manifests (voxanim-site.tar.gz) from the latest release, so the site is
# rebuilt whenever a release is published as well as on every push.  The full
# videos are on the releases of the two media repositories (<repo>-light and
# <repo>-dark) and the page streams them from there, so the build
# needs no ffmpeg and nothing worth caching: it used to download every MP4 and
# encode three files from each.
#
# Pages only accepts a deployment from main, and a release runs on its tag: a
# build started by the release was refused at the deploy step every time
# (v1.5.0 to v1.9.0), and the site had to be rebuilt by hand.  So a release does
# not build: it starts this workflow again on main, and that run deploys.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One build at a time.  The release's hand-over is in a group of its own, so a
# build waiting in the queue cannot push it out before it has run.
concurrency:
  group: pages-${{ github.event_name == 'release' && 'handover' || 'build' }}
  cancel-in-progress: false

jobs:
  on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml -R ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python website/build_site.py _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
