name: Website

# Builds the GitHub Pages site (website/build_site.py) and deploys it.  The videos
# are not in git: the build downloads them from the latest release, so the
# site is rebuilt whenever a release is published as well as on every push.
#
# Pages only accepts a deployment from main, and a release runs on its tag: a
# build started by the release was refused at the deploy step every time
# (v1.5.0 to v1.9.0), and the site had to be rebuilt by hand.  So a release does
# not build: it starts this workflow again on main, and that run deploys.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One build at a time.  The release's hand-over is in a group of its own, so a
# build waiting in the queue cannot push it out before it has run.
concurrency:
  group: pages-${{ github.event_name == 'release' && 'handover' || 'build' }}
  cancel-in-progress: false

jobs:
  on-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml -R ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - id: release
        run: echo "tag=$(gh release view -R ${{ github.repository }} --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # The release's MP4s and their previews and posters, so only the first
      # build after a release downloads and encodes them.
      - uses: actions/cache@v4
        with:
          path: _site/media
          key: site-media-${{ steps.release.outputs.tag }}-${{ hashFiles('website/build_site.py') }}
      - run: python website/build_site.py _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
